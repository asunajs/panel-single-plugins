<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>央视频</title>
    <script src="boot.js"></script>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; padding: 20px;
        font: 14px/1.6 -apple-system, "PingFang SC", "Segoe UI", sans-serif;
        color: #e8e8ed; background: #141417;
      }
      @media (prefers-color-scheme: light) {
        body { color: #1a1a1f; background: #f5f5f7; }
      }
      .page { max-width: 640px; margin: 0 auto; display: grid; gap: 16px; }
      .title { font-size: 20px; margin: 0; }
      .hint { color: #88888f; font-size: 12px; margin: 2px 0 0; }
      .card {
        border: 1px solid color-mix(in srgb, currentColor 14%, transparent);
        border-radius: 12px; padding: 16px; background: color-mix(in srgb, currentColor 4%, transparent);
      }
      .card-title { font-size: 15px; font-weight: 600; margin: 0 0 10px; }
      .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
      input {
        flex: 1; min-width: 140px; padding: 8px 10px; border-radius: 8px;
        border: 1px solid color-mix(in srgb, currentColor 22%, transparent);
        background: transparent; color: inherit; font: inherit;
      }
      button {
        padding: 8px 14px; border-radius: 8px; border: 1px solid color-mix(in srgb, currentColor 22%, transparent);
        background: transparent; color: inherit; font: inherit; cursor: pointer;
      }
      button.primary { background: #2f6fed; border-color: #2f6fed; color: #fff; }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      .badge { font-size: 12px; padding: 2px 10px; border-radius: 99px;
        border: 1px solid color-mix(in srgb, currentColor 25%, transparent); }
      .badge.ok { color: #2fa36b; border-color: #2fa36b; }
      .badge.bad { color: #e05252; border-color: #e05252; }
      pre {
        margin: 10px 0 0; padding: 10px; border-radius: 8px; white-space: pre-wrap;
        word-break: break-all; max-height: 260px; overflow: auto;
        background: color-mix(in srgb, currentColor 7%, transparent);
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      label.switch { display: flex; align-items: center; gap: 6px; font-size: 13px; }
      .muted { color: #88888f; font-size: 12px; }
      a { color: inherit; }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="top">
        <h1 class="title">央视频</h1>
        <p class="hint">短信登录 · 任务结算 · 积分领取</p>
      </header>

      <!-- ① 账号状态 -->
      <section class="card">
        <div class="row" style="justify-content: space-between">
          <div>
            <div class="card-title" style="margin: 0">账号</div>
            <span id="state" class="badge">检查中…</span>
          </div>
          <button id="btn-logout" class="btn" type="button" hidden>退出登录</button>
        </div>
        <p id="account-summary" class="hint">正在读取…</p>
      </section>

      <!-- ② 短信登录 -->
      <section class="card" id="login-card">
        <div class="card-title">短信登录</div>
        <div class="row">
          <input id="phone" inputmode="numeric" maxlength="11" placeholder="11 位手机号" autocomplete="tel" />
          <button id="btn-send" type="button">发验证码</button>
        </div>
        <div class="row" style="margin-top: 10px">
          <input id="code" inputmode="numeric" maxlength="8" placeholder="短信验证码" autocomplete="one-time-code" />
          <button id="btn-login" class="primary" type="button" disabled>登录</button>
        </div>
        <p class="hint" style="margin-top: 10px">
          验证码一次一码。登录成功后 token 保存在插件数据目录（0600），之后任务无需重复登录。
        </p>
      </section>

      <!-- ③ 任务 -->
      <section class="card">
        <div class="row" style="justify-content: space-between">
          <div class="card-title" style="margin: 0">积分任务</div>
          <label class="switch muted"><input id="like-first" type="checkbox" /> 先点赞一次</label>
        </div>
        <div class="row" style="margin-top: 10px">
          <button id="btn-tasks" type="button">查看任务</button>
          <button id="btn-do" class="primary" type="button">一键做任务</button>
          <button id="btn-cookies" type="button">导出 cookie</button>
        </div>
        <pre id="out">（还没有输出）</pre>
      </section>
    </main>

    <script>
      'use strict';
      const API = 'api'; // 相对路径 → 插件自注册路由（同源，无需 CORS）
      const $ = (id) => document.getElementById(id);
      const out = $('out');

      function say(msg) { out.textContent += (out.textContent ? '\n' : '') + msg; }

      async function call(path, opts = {}) {
        const init = { method: opts.method || 'GET', headers: { 'x-panel': '1' } };
        if (opts.body !== undefined) {
          init.headers['content-type'] = 'application/json';
          init.body = JSON.stringify(opts.body);
        }
        const res = await fetch(`${API}/${path}`, init);
        let json = null;
        try { json = await res.json(); } catch { /* 非 JSON */ }
        if (!res.ok || json?.ok === false) {
          throw new Error(json?.message || `HTTP ${res.status}`);
        }
        return json;
      }

      function setState(ok, text) {
        const el = $('state');
        el.className = 'badge ' + (ok ? 'ok' : 'bad');
        el.textContent = text;
      }

      async function refreshStatus() {
        try {
          const r = await call('status');
          if (r.loggedIn) {
            setState(true, `已登录 ${r.nickname || ''}（vuid ${r.vuid}）`);
            $('account-summary').textContent =
              `积分 ${r.points ?? '?'} · 登录于 ${r.loggedAt ? new Date(r.loggedAt).toLocaleString() : '?'}`;
            $('login-card').hidden = true;
            $('btn-logout').hidden = false;
          } else {
            setState(false, '未登录');
            $('account-summary').textContent = '用手机号 + 短信验证码登录一次即可';
            $('login-card').hidden = false;
            $('btn-logout').hidden = true;
          }
        } catch (e) {
          setState(false, '状态未知');
          $('account-summary').textContent = e.message;
        }
      }

      $('btn-send').addEventListener('click', async () => {
        const phone = $('phone').value.trim();
        if (!/^\d{11}$/.test(phone)) { say('✗ 请输入 11 位手机号'); return; }
        $('btn-send').disabled = true;
        try {
          const r = await call('login/send', { method: 'POST', body: { phone } });
          say('✓ ' + r.message);
          $('btn-login').disabled = false;
          $('code').focus();
        } catch (e) { say('✗ ' + e.message); }
        $('btn-send').disabled = false;
      });

      $('btn-login').addEventListener('click', async () => {
        const code = $('code').value.trim();
        if (!/^\d{4,8}$/.test(code)) { say('✗ 验证码应为 4–8 位数字'); return; }
        $('btn-login').disabled = true;
        try {
          const r = await call('login/verify', { method: 'POST', body: { phone: $('phone').value.trim(), code } });
          say('✓ ' + r.message + `（vuid ${r.vuid}）`);
          $('code').value = '';
          await refreshStatus();
        } catch (e) { say('✗ ' + e.message); }
        $('btn-login').disabled = false;
      });

      $('btn-tasks').addEventListener('click', async () => {
        try {
          const r = await call('tasks');
          say(r.lines.join('\n'));
        } catch (e) { say('✗ ' + e.message); }
      });

      $('btn-do').addEventListener('click', async () => {
        $('btn-do').disabled = true;
        try {
          const r = await call('do-tasks', {
            method: 'POST',
            body: { likeFirst: $('like-first').checked },
          });
          say(r.lines.join('\n'));
          say('✓ ' + r.message);
          await refreshStatus();
        } catch (e) { say('✗ ' + e.message); }
        $('btn-do').disabled = false;
      });

      $('btn-cookies').addEventListener('click', async () => {
        try {
          const r = await call('cookies');
          say(r.netscape);
        } catch (e) { say('✗ ' + e.message); }
      });

      $('btn-logout').addEventListener('click', async () => {
        if (!confirm('确定退出登录？token 将被删除。')) return;
        try {
          await call('logout', { method: 'POST' });
          say('✓ 已退出');
          await refreshStatus();
        } catch (e) { say('✗ ' + e.message); }
      });

      refreshStatus();
    </script>
  </body>
</html>
