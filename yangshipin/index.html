<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>央视频</title>
    <link rel="stylesheet" href="/css/reset.css" />
    <link rel="stylesheet" href="/css/theme.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="boot.js"></script>
  </head>
  <body>
    <main class="page">
      <header class="top">
        <div>
          <h1 class="title">央视频</h1>
          <p class="hint">短信登录 · 任务结算 · 积分领取</p>
        </div>
        <div class="top-right">
          <span id="state" class="badge idle">未连接</span>
          <button id="refresh" class="btn" type="button">刷新</button>
        </div>
      </header>

      <section class="card">
        <div class="card-head">
          <div>
            <h2 class="card-title">账号</h2>
            <p id="account-summary" class="hint">正在读取账号…</p>
          </div>
          <button id="add-account" class="btn primary" type="button">添加账号</button>
        </div>

        <ul id="account-list" class="account-list"></ul>
        <p id="account-empty" class="empty-hint" hidden>
          还没有账号。点「添加账号」，用手机号和短信验证码登录一次即可。
        </p>
      </section>

      <section class="card">
        <div class="card-head">
          <div>
            <h2 class="card-title">运行</h2>
            <p id="run-hint" class="hint">结算 7 个任务并领取积分；结果会显示在下面。</p>
          </div>
        </div>
        <div class="row">
          <button id="status" class="btn" type="button">查询任务</button>
          <button id="run" class="btn primary" type="button">一键做任务</button>
          <button id="cookies" class="btn" type="button">导出 cookie</button>
        </div>
        <pre id="out" class="out">（还没有输出）</pre>
      </section>

      <p class="hint footer-note">
        任务每天 0 点重置，观看类上限 3 次/天。登录凭证保存在插件数据目录（0600），
        不会写进这个静态页面。
      </p>
    </main>

    <!-- 添加账号：短信登录 -->
    <div class="dialog-back" id="login-dialog" hidden>
      <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="login-title">
        <div class="dialog-head">
          <span id="login-title">添加账号</span>
          <button id="login-close" class="btn ghost" type="button">关闭</button>
        </div>
        <div class="dialog-body">
          <label class="field">
            <span class="field-label">手机号</span>
            <input id="login-phone" class="input" type="tel" inputmode="numeric"
              maxlength="11" placeholder="11 位手机号" autocomplete="tel" />
          </label>

          <div class="row">
            <button id="send-code" class="btn" type="button">发送验证码</button>
          </div>

          <label class="field">
            <span class="field-label">短信验证码</span>
            <input id="login-code" class="input" type="text" inputmode="numeric"
              maxlength="8" placeholder="短信验证码" autocomplete="one-time-code" />
          </label>

          <p id="login-hint" class="hint"></p>

          <div class="row end">
            <button id="login-cancel" class="btn" type="button">取消</button>
            <button id="login" class="btn primary" type="button">登录并保存</button>
          </div>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
